[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsumxai"
version = "0.1.0"
description = "Reproducible decoder-only attribution baseline"
requires-python = ">=3.11"
dependencies = ["torch==2.8.0", "transformers==4.56.2"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
py-modules = ["baseline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
